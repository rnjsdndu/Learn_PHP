<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container mt-3 w-50">
      <h1 class="h1"><?= $board_title?></h1>
    </div>
    <div class="container my-3 border border-1 w-50 vstack">
      <div class="p-3">
        <span class="h3 fw-bolder"><?= $row['subject']; ?></span>
      </div>
      <div
        class="d-flex px-3 border border-top-0 border-start-0 border-end-0 border-bottom-1"
      >
        <span><?= $row['name']; ?></span>
        <span class="ms-5 me-auto"><?= $row['hit']; ?>회</span>
        <span><?= $row['rdate']; ?></span>
      </div>
      <div class="p-3"><?= $row['content']; ?></div>

      <div class="d-flex gap-2 p-3">
        <button class="btn btn-primary me-auto" id="btn_list">목록</button>
        <button
          class="btn btn-secondary"
          data-bs-toggle="modal"
          data-bs-target="#modal"
          id="btn_edit"
        >
          수정
        </button>
        <button
          class="btn btn-danger"
          data-bs-toggle="modal"
          data-bs-target="#modal"
          id="btn_delete"
        >
          삭제
        </button>
      </div>
    </div>

    <div class="modal" tabindex="-1" id="modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modal_title">Modal title</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <input
              type="password"
              name="password"
              class="form-control"
              id="password"
              placeholder="비밀번호를 입력해 주세요"
            />
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" class="btn btn-primary" id="btn_password_chk">
              확인
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
