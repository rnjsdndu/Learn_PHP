<?php 
  $code = (isset($_GET['code']) && $_GET['code'] != '') ? $_GET['code'] : '';

  switch($code) {
    case 'free' : $board_title = '자유게시판'; break;
    case 'notice' : $board_title = '공지사항'; break;
    default : $code = 'free'; $board_title = '자유게시판';
  }
?>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><?= $board_title?> 글쓰기</title>
  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-lite.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-lite.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <style>
    #bbs_content img{
      max-width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="mt-4 mb-3">
      <span class="h2"><?= $board_title?></span>
    </div>
    <div class="mb-2 d-flex gap-2">
      <input type="text" name="name" class="form-control w-25" placeholder="글쓴이" autocomplete="off" id="id_name">
      <input type="password" name="password" class="form-control w-25" placeholder="비밀번호" autocomplete="off" id="id_password">
    </div>

    <div>
      <input type="text" name="subject" class="form-control mb-2" autocomplete="off" id="id_subject">
    </div>
  
    <div id="summernote"></div>
  
    <div class="mt-2 d-flex gap-2 justify-content-end">
      <button class="btn btn-primary" id="btn_submit">확인</button>
      <a href="./list.html?code=<?= $code ?>" class="btn btn-secondary">목록</a>
    </div>

  </div>


  
    <script>

      const btn_submit = document.querySelector('#btn_submit')
      btn_submit.addEventListener('click', () => {
        const id_name = document.querySelector('#id_name')
        const id_password = document.querySelector('#id_password')
        const id_subject = document.querySelector('#id_subject')
        if(id_name.value == '') {
          alert('글쓴이를 입력하세요.')
          id_name.focus();
          return
        }

        if(id_password.value == '') {
          alert('비밀번호를 입력하세요.')
          id_password.focus();
          return
        }

        if(id_subject.value == '') {
          alert('제목을 입력하세요.')
          id_subject.focus();
          return
        }

        let markupStr = $('#summernote').summernote('code');
        if(markupStr == '<p><br></p>') {
          alert('내용을 입력하세요.');
          return;
        }

        const aa = window.location.search.replace("?", "").split(/[=?&]/) // ['code', 'notice']
        // const aa = window.location.search.replace("?", "") // ?code=notice

        let param = {}
        for (let i = 0; i < aa.length; i++) {
          param[aa[i]] = aa[++i] // param['code'] = 'notice'
        }

        const code = param['code']
        

        const f1 = new FormData()

        f1.append("name", id_name.value)
        f1.append("password", id_password.value)
        f1.append("subject", id_subject.value)
        f1.append("content", markupStr)
        f1.append('code', code)

        const xhr = new XMLHttpRequest();
        xhr.open("POST", "./write.php", "true") // 비동기(true)
        xhr.send(f1);
        btn_submit.disalbed = true
        xhr.onload = () => {
          if(xhr.status == 200) {
            const data = JSON.parse(xhr.responseText)
            if(data.result == 'success') {
              alert('글이 성공적으로 등록되었습니다.')
              self.location.href = '/list.html?code='+code;
            } else {
              alert('글 등록이 실패했습니다.')
            }
          }else {
            alert('통신에 실패했습니다.')
          }
        }

      })

      $('#summernote').summernote({
        placeholder: '글 내용을 입력해 주세요.',
        tabsize: 2,
        height: 300,
        toolbar: [
          ['style', ['style']],
          ['font', ['bold', 'underline', 'clear']],
          ['color', ['color']],
          ['para', ['ul', 'ol', 'paragraph']],
          ['table', ['table']],
          ['insert', ['link', 'picture', 'video']],
          ['view', ['fullscreen', 'codeview', 'help']]
        ]
      });

      
    </script>
</body>
</html>
